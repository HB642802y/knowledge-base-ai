      <path d="M120 300 L390 166"/>
      <path d="M220 300 L470 154"/>
      <path d="M330 300 L560 146"/>
      <path d="M455 300 L650 140"/>
      <path d="M590 300 L750 134"/>
      <path d="M735 300 L870 128"/>
    </g>
  </g>

  <rect x="0" y="0" width="920" height="300" rx="10" fill="none" stroke="#d5edf8" stroke-width="2"/>

  <g transform="translate(390 18)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="22" font-size="22" font-weight="700" fill="#111827">المملكة المغربية</text>
    <text x="70" y="55" font-size="26" font-weight="800" fill="#111827">ROYAUME DU MAROC</text>
  </g>

  <g transform="translate(421 84)">
    <circle cx="39" cy="39" r="35" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
    <path d="M39 10 L46 31 L68 31 L50 44 L57 65 L39 52 L21 65 L28 44 L10 31 L32 31 Z" fill="#d71920"/>
    <path d="M39 18 L43 34 L59 34 L46 43 L51 58 L39 49 L27 58 L32 43 L19 34 L35 34 Z" fill="#0f8a43"/>
    <path d="M11 66 C2 49 4 28 17 14" fill="none" stroke="#c9922c" stroke-width="5" stroke-linecap="round"/>
    <path d="M67 66 C76 49 74 28 61 14" fill="none" stroke="#c9922c" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#111827">
    <text x="460" y="178" font-size="23" font-weight="700">وزارة الفلاحة والصيد البحري والتنمية القروية والمياه والغابات</text>
    <text x="460" y="220" font-size="25" font-weight="700">Ministere de l'Agriculture, de la Peche Maritime, du Developpement Rural</text>
    <text x="460" y="255" font-size="25" font-weight="700">et des Eaux et Forets</text>
