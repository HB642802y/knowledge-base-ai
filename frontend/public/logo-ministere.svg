      <path d="M48 0 V300 M132 0 V300 M216 0 V300 M300 0 V300 M384 0 V300 M468 0 V300 M552 0 V300 M636 0 V300 M720 0 V300 M804 0 V300 M888 0 V300"/>
    </g>
