<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Royaume du Maroc - Ministere de l'Agriculture</title>
  <desc id="desc">Logo institutionnel avec fond agricole et libelle du ministere</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b9e5ff"/>
      <stop offset="0.55" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#e8f8dd"/>
    </linearGradient>
    <linearGradient id="field" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7ec850"/>
      <stop offset="1" stop-color="#2f8f35"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="920" height="300" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
